<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elligo Health Network Locations</title>
<style>
  :root {
    --ink: #2b2733;
    --page-bg: #ffffff;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--page-bg);
    color: var(--ink);
    padding: 40px 16px;
  }

  .card {
    max-width: 1280px;
    margin: 0 auto;
    background: var(--card-bg);
    padding: 36px 36px 28px;
  }

  .map-wrap {
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    line-height: 0;
    user-select: none;
  }

  .map-wrap img.basemap {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
  }

  .bubble-anchor {
    position: absolute;
    transform: translate(-50%, -50%);
    transition: opacity .35s ease, transform-origin 0s;
    z-index: 2;
  }

  .bubble-anchor:hover,
  .bubble-anchor.tooltip-pinned {
    z-index: 100;
  }

  .bubble-anchor.is-hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* while a tooltip is locked open, block hover/tooltips on every other bubble */
  #bubbleLayer.locked .bubble-anchor {
    pointer-events: none;
  }

  #bubbleLayer.locked .bubble-anchor.tooltip-pinned {
    pointer-events: auto;
  }

  .bubble-anchor.is-hidden .bubble {
    transform: scale(.35);
  }

  .bubble {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(20, 15, 30, 0.28);
    cursor: pointer;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
    will-change: transform;
  }

  .bubble-anchor:hover .bubble {
    transform: scale(1.18) !important;
    box-shadow: 0 8px 18px rgba(20, 15, 30, 0.35);
    z-index: 5;
  }

  .bubble svg {
    width: 52%;
    height: 52%;
    display: block;
  }

  .tooltip {
    position: absolute;
    bottom: 115%;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    color: var(--ink);
    padding: 16px 16px;
    border-radius: 8px;
    font-size: 12px;
    text-align: left;
    white-space: nowrap;
    min-width: 200px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease;
    box-shadow: 0 4px 14px rgba(20, 15, 30, 0.22);
    z-index: 50;
  }

  .tooltip-title {
    display: block;
    font-weight: 600;
    font-size: 12.5px;
    margin-bottom: 10px;
  }

  .tooltip-line {
    display: block;
    color: #8a8794;
    font-size: 11px;
    line-height: 1.5;
  }

  .tooltip-addr {
    margin-bottom: 1px;
  }

  .tooltip-phone {
    margin-top: 9px;
  }

  .tooltip-line a {
    color: #400c27;
    text-decoration: none;
  }

  .tooltip-line a:hover {
    color: #f32735;
    text-decoration: underline;
  }

  .tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: calc(50% + var(--arrow-shift, 0px));
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #ffffff;
  }

  .bubble-anchor:hover .tooltip,
  .bubble-anchor.tooltip-pinned .tooltip {
    opacity: 1;
    pointer-events: auto;
  }

  .legend {
    display: grid;
    grid-template-columns: repeat(4, auto);
    column-gap: 34px;
    row-gap: 12px;
    width: fit-content;
    margin: 34px auto 0;
  }

  @media (max-width: 900px) {
    .legend {
      grid-template-columns: repeat(2, auto);
    }
  }

  @media (max-width: 480px) {
    .legend {
      grid-template-columns: repeat(1, auto);
    }
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    padding: 6px 10px;
    border-radius: 999px;
    transition: background .2s ease, opacity .2s ease, transform .15s ease;
  }

  .legend-item:hover {
    background: #f3f2f5;
  }

  .legend-item.active {
    background: #efedf1;
    font-weight: 600;
  }

  .legend.has-active .legend-item:not(.active) {
    opacity: 0.42;
  }

  .legend-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .legend-dot svg {
    width: 55%;
    height: 55%;
    display: block;
  }

  .legend-label {
    white-space: nowrap;
  }

</style>
</head>
